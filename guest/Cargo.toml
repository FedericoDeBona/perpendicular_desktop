[package]
name = "perpendicular-guest"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = [
  "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_EnhancedStorage",
  "Win32_System_Com", "Win32_System_Environment", "Win32_System_Memory",
  "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_System_Threading",
  "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
  "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = true
strip = true
panic = "abort"
